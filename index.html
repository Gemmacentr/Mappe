<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mappe · Stili di OpenStreetMap con Leaflet</title>
    <meta
      name="description"
      content="Prova di Leaflet: una mappa di Bologna con diversi stili di OpenStreetMap."
    />

    <!-- Leaflet (CSS) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />

    <!-- Leaflet (JS) e script della mappa -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
      defer
    ></script>
    <script src="script.js" defer></script>
  </head>

  <body>
    <!-- Contenitore della mappa: occupa tutta la pagina -->
    <main id="map" aria-label="Mappa di Bologna"></main>
  </body>
</html>
